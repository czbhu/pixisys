<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Garage door background -->
  <rect x="4" y="8" width="24" height="20" fill="#2c3e50" stroke="#34495e" stroke-width="1"/>
  
  <!-- Garage door panels -->
  <rect x="6" y="10" width="20" height="4" fill="#34495e"/>
  <rect x="6" y="16" width="20" height="4" fill="#34495e"/>
  <rect x="6" y="22" width="20" height="4" fill="#34495e"/>
  
  <!-- Garage door handle -->
  <circle cx="26" cy="18" r="1.5" fill="#ecf0f1"/>
  
  <!-- Roof -->
  <polygon points="2,8 16,2 30,8" fill="#e74c3c"/>
  
  <!-- Door opening indicator (light) -->
  <rect x="14" y="12" width="4" height="2" fill="#f39c12" opacity="0.8"/>
  
  <!-- Small car icon inside -->
  <rect x="12" y="20" width="8" height="3" fill="#3498db" rx="1"/>
  <circle cx="14" cy="24" r="1" fill="#2c3e50"/>
  <circle cx="18" cy="24" r="1" fill="#2c3e50"/>
</svg>
