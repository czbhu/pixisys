# PixiERP Production - erp.pixisys.eu
# Apache (192.168.5.25) -> nginx (192.168.5.60) -> Backend (localhost:8003)

server {
    listen 80;
    server_name erp.pixisys.eu;

    # Backend API
    location /api/ {
        proxy_pass http://127.0.0.1:8003;
        proxy_http_version 1.1;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # Header forwarding
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Ne írjuk felül az Apache X-Forwarded-* header-eit!
        # Az nginx automatikusan továbbítja őket
        
        proxy_cache_bypass $http_upgrade;
        proxy_redirect off;
        
        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Django admin static files
    location ~ ^/(admin|api-auth)/.*\.(?:css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://localhost:8003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Media files
    location /media/ {
        alias __SCRIPT_DIR__/pixierp/media/;
        expires 7d;
    }

    # Frontend - Production build
    location / {
        root __SCRIPT_DIR__/pixierp/frontend/build;
        try_files $uri $uri/ /index.html;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # Static files from build
    location /static/ {
        root __SCRIPT_DIR__/pixierp/frontend/build;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Logging
    access_log /var/log/nginx/erp.pixisys.eu-access.log;
    error_log /var/log/nginx/erp.pixisys.eu-error.log;
}
