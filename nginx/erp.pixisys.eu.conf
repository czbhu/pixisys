# PixiERP Production - erp.pixisys.eu
# Modified to include WebSocket and SSL restoration

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Determine the correct scheme (http/https) to pass to the backend
# If behind a reverse proxy (X-Forwarded-Proto set), use that.
# Otherwise use the local scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    server_name erp.pixisys.eu e.pixisys.eu;
    client_max_body_size 1000M;

    # Backend API
    location /api/ {
        proxy_pass http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Use the mapped variable to support both direct SSL and Reverse Proxy SSL
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_cache_bypass $http_upgrade;
        proxy_redirect off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # WebSocket support
    location /ws/ {
        proxy_pass http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade "websocket";
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 86400;
        
        # Force keepalive
        proxy_socket_keepalive on;
    }

    # Django admin static files
    location ~ ^/(admin|api-auth)/.*\.(?:css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://localhost:8003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Media files
    location /media/ {
        alias /home/ceze/pixisys/pixierp/media/;
        expires 7d;
    }

    # Frontend - Production build
    location / {
        root /home/ceze/pixisys/pixierp/frontend/build;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Static files from build
    location /static/ {
        root /home/ceze/pixisys/pixierp/frontend/build;
        expires 1y;
        add_header Cache-Control "public, immutable";

        # Ensure .mjs files are served with correct MIME type (pdfjs worker)
        location ~* \.mjs$ {
            add_header Cache-Control "public, immutable";
            types { }
            default_type application/javascript;
        }
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Logging
    access_log /var/log/nginx/erp.pixisys.eu-access.log;
    error_log /var/log/nginx/erp.pixisys.eu-error.log;

    # SSL Config (Commented out for initial install - run certbot to enable)
    listen 80;
    # listen 443 ssl; 
    # ssl_certificate /etc/letsencrypt/live/erp.pixisys.eu-0001/fullchain.pem; 
    # ssl_certificate_key /etc/letsencrypt/live/erp.pixisys.eu-0001/privkey.pem; 
    # include /etc/letsencrypt/options-ssl-nginx.conf; 
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; 
}

